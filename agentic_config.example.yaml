llm:
  provider: openai  # set to "ollama" to use a local model exposed by Ollama
  model: gpt-4o-mini  # ignored if provider=ollama unless you change it
  base_url: http://localhost:11434  # only used for ollama; leave as-is for openai

agents:
  query:
    temperature: 0.35
  search:
    temperature: 0.1
  pdf:
    temperature: 0.1
  summarizer:
    temperature: 0.2
  query_rerank:
    temperature: 0.2
  pdf_rerank:
    temperature: 0.1
  validator:
    temperature: 0.0

search:
  target_results: 50  # minimum number of unique papers to gather (optional)

scoring:
  enable_embeddings: true
  enable_cross_encoder: true
  cross_encoder_top_n: 80
  embedding_model: text-embedding-3-large
  cross_encoder_model: gpt-4o-mini
  weights_path: scoring_weights.json

# Copy this file to agentic_config.yaml (git-ignored) and edit as needed.
# Never commit real API keys—use environment variables like OPENAI_API_KEY instead.
